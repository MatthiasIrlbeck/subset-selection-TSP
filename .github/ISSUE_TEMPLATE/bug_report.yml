name: Bug report
description: Report incorrect behavior, a crash, or an invariant violation
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not disclose security vulnerabilities here; use private vulnerability reporting.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v2.0.0 or a full commit SHA
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Minimal command or C++ reproducer
      render: shell
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, compiler, build flags, CPU, external oracle identity, and relevant logs
    validations:
      required: true
