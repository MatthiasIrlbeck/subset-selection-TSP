name: Real-oracle integration

# Deliberately manual-only until the independently verified oracle digests are
# configured as repository variables. See docs/releases/publication_checklist.md.
on:
  workflow_dispatch:
    inputs:
      lkh_sha256:
        description: Independently verified SHA-256 of LKH-3.0.14.tgz
        required: false
        type: string
      concorde_sha256:
        description: Independently verified SHA-256 of the official Concorde Linux gzip
        required: false
        type: string

permissions:
  contents: read

jobs:
  lkh-concorde:
    name: lkh-3.0.14-and-concorde
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LKH_ARCHIVE_SHA256: ${{ inputs.lkh_sha256 || vars.LKH_3_0_14_SHA256 }}
      CONCORDE_ARCHIVE_SHA256: ${{ inputs.concorde_sha256 || vars.CONCORDE_LINUX24_SHA256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install build and runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl gzip libc6-i386 ninja-build \
            python3 python3-jsonschema
      - name: Check generated option surfaces
        run: python3 scripts/generate_options.py --check
      - name: Build aldous_tsp
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DALDOUS_TSP_ENABLE_WARNINGS=ON \
            -DALDOUS_TSP_ENABLE_WERROR=ON
          cmake --build build --target aldous_tsp --parallel 2
      - name: Require independently approved oracle digests
        shell: bash
        run: |
          set -euo pipefail
          [[ "$LKH_ARCHIVE_SHA256" =~ ^[0-9a-fA-F]{64}$ ]] || {
            echo "Configure repository variable LKH_3_0_14_SHA256 or supply workflow input lkh_sha256" >&2
            exit 1
          }
          [[ "$CONCORDE_ARCHIVE_SHA256" =~ ^[0-9a-fA-F]{64}$ ]] || {
            echo "Configure repository variable CONCORDE_LINUX24_SHA256 or supply workflow input concorde_sha256" >&2
            exit 1
          }
      - name: Download, verify, and build LKH 3.0.14
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p external-solvers downloads
          python3 scripts/verified_download.py \
            --lock config/oracle_sources.json \
            --source lkh-3.0.14 \
            --expected-sha256 "$LKH_ARCHIVE_SHA256" \
            --output downloads/LKH-3.0.14.tgz
          tar -xzf downloads/LKH-3.0.14.tgz -C external-solvers
          make -C external-solvers/LKH-3.0.14 -j2
          install -m 0755 external-solvers/LKH-3.0.14/LKH external-solvers/LKH
      - name: Download and verify official Concorde Linux executable
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verified_download.py \
            --lock config/oracle_sources.json \
            --source concorde-linux24 \
            --expected-sha256 "$CONCORDE_ARCHIVE_SHA256" \
            --output downloads/concorde.gz
          gzip -dc downloads/concorde.gz > external-solvers/concorde
          chmod 0755 external-solvers/concorde
          external-solvers/concorde -h >/dev/null 2>&1 || true
      - name: Run provenance-checked integration matrix
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/oracle_real_smoke.py \
            --exe build/aldous_tsp \
            --schema schema/results.schema.json \
            --lkh-path external-solvers/LKH \
            --concorde-path external-solvers/concorde \
            --require-lkh \
            --require-concorde \
            --out-dir real-oracle-evidence
      - name: Remove copied solver executables before artifact upload
        if: always()
        shell: bash
        run: rm -rf "real-oracle-evidence/solver binaries with spaces"
      - name: Upload provenance and integration evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: real-oracle-integration-evidence
          if-no-files-found: warn
          path: real-oracle-evidence
