name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gcc-release
            cc: gcc
            cxx: g++
            build_type: Release
            sanitizer: OFF
            packages: ninja-build g++ python3-jsonschema
            python_tests: ON
          - name: clang-release
            cc: clang
            cxx: clang++
            build_type: Release
            sanitizer: OFF
            packages: ninja-build clang python3-jsonschema
            python_tests: ON
          - name: clang-debug-asan-ubsan
            cc: clang
            cxx: clang++
            build_type: Debug
            sanitizer: ON
            packages: ninja-build clang python3-jsonschema
            python_tests: ON
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.packages }} python3 python3-matplotlib
      - name: Check generated option surfaces
        run: python3 scripts/generate_options.py --check
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DBUILD_TESTING=ON
          -DALDOUS_TSP_ENABLE_WARNINGS=ON
          -DALDOUS_TSP_ENABLE_WERROR=ON
          -DALDOUS_TSP_ENABLE_SANITIZERS=${{ matrix.sanitizer }}
          -DALDOUS_TSP_ENABLE_PYTHON_TESTS=${{ matrix.python_tests }}
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:strict_string_checks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build --output-on-failure
      - name: Low-memory build smoke
        if: matrix.sanitizer == 'OFF'
        run: |
          cmake -S . -B build-low-memory -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DALDOUS_TSP_ENABLE_WARNINGS=ON \
            -DALDOUS_TSP_ENABLE_WERROR=ON \
            -DALDOUS_TSP_LOW_MEMORY_BUILD=ON
          cmake --build build-low-memory --target aldous_tsp --parallel
          ./build-low-memory/aldous_tsp --dry-run --N 12 --instances 1 --p-values 1.0 --threads 1
      - name: Install package smoke
        if: matrix.sanitizer == 'OFF'
        run: |
          cmake --install build --prefix install-tree
          mkdir -p consumer-smoke
          cat > consumer-smoke/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.20)
          project(consumer_smoke LANGUAGES CXX)
          find_package(aldous_tsp CONFIG REQUIRED)
          add_executable(consumer main.cpp)
          target_link_libraries(consumer PRIVATE aldous_tsp::core)
          EOF
          cat > consumer-smoke/main.cpp <<'EOF'
          #include "aldous_tsp/instance.hpp"
          int main(){ aldous_tsp::Instance inst; inst.set_points({{0,0},{1,0},{0,1}}); inst.build_knn(2); return inst.N == 3 ? 0 : 1; }
          EOF
          cmake -S consumer-smoke -B consumer-smoke/build -G Ninja -DCMAKE_PREFIX_PATH=$PWD/install-tree
          cmake --build consumer-smoke/build
          ./consumer-smoke/build/consumer
      - name: Plot smoke output
        if: matrix.sanitizer == 'OFF'
        run: python3 scripts/plot_results.py build/quick-smoke.json -o build/quick-smoke.png

  python-lint:
    name: ruff-correctness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Ruff
        run: python -m pip install ruff==0.12.4
      - name: Check Python correctness
        run: python -m ruff check scripts tests

  clang-tidy:
    name: clang-tidy-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang clang-tidy
      - name: Configure
        run: >-
          cmake -S . -B build-tidy -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          -DBUILD_TESTING=OFF
          -DALDOUS_TSP_BUILD_CLI=OFF
          -DALDOUS_TSP_ENABLE_WARNINGS=ON
          -DALDOUS_TSP_ENABLE_WERROR=ON
          -DALDOUS_TSP_ENABLE_CLANG_TIDY=ON
      - name: Run clang-tidy while building handwritten core sources
        run: cmake --build build-tidy --target aldous_tsp_core --parallel 2

  thread-sanitizer:
    name: gcc-thread-sanitizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++
      - name: Configure
        env:
          CC: gcc
          CXX: g++
        run: >-
          cmake -S . -B build-tsan -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_TESTING=ON
          -DALDOUS_TSP_ENABLE_WARNINGS=ON
          -DALDOUS_TSP_ENABLE_WERROR=ON
          -DALDOUS_TSP_ENABLE_TSAN=ON
          -DALDOUS_TSP_ENABLE_PYTHON_TESTS=OFF
      - name: Build
        run: cmake --build build-tsan --parallel 2
      - name: Run concurrency-sensitive suites
        env:
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1:history_size=7
        shell: bash
        run: |
          tests=(
            test_knn_memory_representation_and_lazy_reverse
            test_restart_worker_exception_propagation
            test_experiment_worker_states_and_callback_exceptions
            test_restart_thread_invariance
            test_oracle_posix_spawn_timeout_and_concurrency
            test_tsp_screening_thread_invariance
            test_public_api_validation_and_concurrent_atomic_writers
          )
          for test_name in "${tests[@]}"; do
            echo "::group::${test_name}"
            timeout 90s ./build-tsan/aldous_tsp_test_core "${test_name}"
            echo "::endgroup::"
          done

  historical-performance:
    name: historical-hotpath-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++ python3-jsonschema
      - name: Resolve pinned baseline
        id: baseline
        shell: bash
        run: |
          commit=$(tr -d '[:space:]' < config/performance_baseline_commit.txt)
          git cat-file -e "${commit}^{commit}"
          echo "commit=${commit}" >> "$GITHUB_OUTPUT"
          git worktree add --detach baseline-tree "$commit"
      - name: Build pinned baseline
        run: |
          cmake -S baseline-tree -B baseline-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DALDOUS_TSP_ENABLE_WARNINGS=ON \
            -DALDOUS_TSP_ENABLE_WERROR=ON
          cmake --build baseline-build --target aldous_tsp --parallel 2
      - name: Build candidate
        run: |
          cmake -S . -B candidate-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DALDOUS_TSP_ENABLE_WARNINGS=ON \
            -DALDOUS_TSP_ENABLE_WERROR=ON
          cmake --build candidate-build --target aldous_tsp --parallel 2
      - name: Compare against pinned baseline
        run: >-
          python3 scripts/benchmark_hotpaths.py
          --baseline-exe baseline-build/aldous_tsp
          --candidate-exe candidate-build/aldous_tsp
          --suite smoke
          --repetitions 3
          --out-dir historical-performance
          --check
          --max-wall-ratio 1.35
          --max-quality-regression 1e-12
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: historical-performance-${{ steps.baseline.outputs.commit }}
          path: historical-performance

  macos:
    name: macos-appleclang-release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install packages
        run: |
          brew install ninja
          python -m pip install jsonschema
      - name: Check generated option surfaces
        run: python scripts/generate_options.py --check
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          -DALDOUS_TSP_ENABLE_WARNINGS=ON
          -DALDOUS_TSP_ENABLE_WERROR=ON
          -DALDOUS_TSP_ENABLE_PYTHON_TESTS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  windows-msvc:
    name: windows-msvc-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: python -m pip install jsonschema
      - name: Check generated option surfaces
        run: python scripts/generate_options.py --check
      - name: Configure
        run: >-
          cmake -S . -B build
          -DBUILD_TESTING=ON
          -DALDOUS_TSP_ENABLE_WARNINGS=ON
          -DALDOUS_TSP_ENABLE_WERROR=ON
          -DALDOUS_TSP_ENABLE_PYTHON_TESTS=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
